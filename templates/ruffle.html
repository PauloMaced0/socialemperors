<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Meta -->
        <meta charset="utf-8"/>
        <!-- Title and Icon -->
        <title id="pageTitle">Social Empires</title>
        <link rel="shortcut icon" href="img/icon.gif"/>
        <link rel="icon" type="image/png" href="img/icon.gif"/>
        <!-- Pin Ruffle: the bare @ruffle-rs/ruffle URL auto-updates to the newest
             build, which silently changed AVM behavior and broke the game once
             already. Bump this version only after testing the game against it. -->
        <script src="https://unpkg.com/@ruffle-rs/ruffle@0.4.1/ruffle.js"></script>
        <!--<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle/ruffle.js"></script>-->
    </head>
    <body style="font-family: 'lucida grande',tahoma,verdana,arial,sans-serif">
    <center>
        <!-- SESSION HEADER -->
        <div id="header" style="width: 760px; margin-top: 50px;">
            <div id="session" style="float: right;">
                <p style="display:inline">Logged in as <b>{{save_info.name}}</b> lvl {{save_info.level}} (<a href="/">logout</a>)</p>
            </div>
        </div>
        <br>
        <!-- GAME BAR -->
        <div id="gameBar" style="margin-top: 15px;">
            <!-- GAME BAR TOP -->
            <div id="gamebar_top" style="width: 760px; height: 90px;">
                <div style="float: left; margin-left:155px; padding: 4px; font-size: 10pt">
                    <!-- VERSION -->
                    <br><br><br>
                    <p style="display: inline">{{ version }}</p>
                </div>
            </div>
            <!-- GAME BAR BUTTONS -->
            <div id="gamebar_buttons" style="width: 760px;">
                &nbsp;
                <a class="gameBarButton" href="#"><div><img src="img/gift.png">Free Gifts</div></a>
                <a class="gameBarButton gameBarButtonSelected" href="#"><div><img>Play</div></a>
                <a class="gameBarButton" href="/friends" target="_blank"><div>🤝 Friends</div></a>
                <a class="gameBarButton" href="#"><div><img src="img/cash.png">Get Cash</div></a>
                <a class="gameBarButton" href="https://discord.gg/zW5gSbQJBw" target="_blank"><div><img src="img/discord.png">Discord</div></a>
                <a class="gameBarButton" href="https://github.com/AcidCaos/socialemperors#readme" target="_blank"><div><img src="img/github.png">GitHub</div></a>
            </div>
            <style>
                #gameBar {
                    text-align: left;
                    width: 760px;
                    margin-bottom: 0px;
                    padding: 0px;
                    background-color:rgb(137, 187, 15);
                    background-image: url('img/Gamebar_byTrevo.png');
                    background-repeat: no-repeat;
                    background-size: contain;
                    border-bottom: solid #6e5335 3px;
                }
                .gameBarButton {
                    display: inline-block;
                    height: 19px;
                    color: black;
                    border: solid 1.5px;
                    border-color: #9e7747;
                    background-color:rgb(255, 245, 131);
                    border-top-left-radius: 5px;
                    border-top-right-radius: 5px;
                    cursor: pointer;
                    text-decoration: none;
                    font-size: 11pt;
                    padding: 2px 3px 1px 3px; 
                }

                .gameBarButtonSelected {
                    background-color:rgb(233, 221, 81);
                }

                .gameBarButton img {
                    height: 17px;
                    padding-right: 3px;
                    vertical-align: middle;
                }

                .gameBarButton:hover {
                    background-color:rgb(250, 237, 90);
                    text-decoration: none;
                }

                .gameBarButtonSelected:hover {
                    background-color:rgb(223, 212, 82);
                }

            </style>
        </div>
        <!-- EMBED GAME -->
        <object>
            <div id='ruffle'></div>
            <script>
                var ruffle = window.RufflePlayer.newest(),
                player = Object.assign(document.getElementById("ruffle").appendChild(ruffle.createPlayer()), {
                    width: 760,
                    height: 600,
                    style: 'width: 760px; height: 600px; background-color: #669C2C;',
                });
                player.load({ // https://ruffle.rs/js-docs/master/interfaces/URLLoadOptions.html
                    // Keep SELoader as the root movie so the loaded game reads
                    // these values from Stage.loaderInfo.parameters.
                    url: "{{SERVERURL}}/default01.static.socialpointgames.com/static/socialempires/flash/SELoader.swf?build=20260723",
                    backgroundColor: "#669C2C",
                    // The ADD ALLY slot calls ExternalInterface
                    // "gotoNeighbors"; the page catches it and opens the
                    // in-game ally popup below, so this must be enabled.
                    // Other stray FB-era calls hit undefined functions,
                    // which Ruffle treats as a no-op.
                    allowScriptAccess: true,
                    // Let the SWF's fullscreen button work: it sets
                    // Stage.displayState = FULL_SCREEN, which Ruffle only
                    // honors when allowFullscreen is enabled (default false).
                    // play.html's <embed> had allowFullScreen="true"; this is
                    // the JS-player equivalent, restored after the
                    // play.html -> ruffle.html redirect.
                    allowFullscreen: true,
                    autoplay: "on",
                    // Suppress Ruffle's "Click to unmute" overlay. autoplay is
                    // already "on"; the overlay only exists to satisfy the
                    // browser audio-gesture policy, and the game has its own
                    // in-HUD sound toggle, so the extra click is just noise.
                    unmuteOverlay: "hidden",
                    // Perf: "low" disables Ruffle's bitmap smoothing / anti-
                    // aliasing, the biggest per-pixel cost when a big fight
                    // puts many animated sprites on screen. wmode opaque skips
                    // transparency compositing; the longer execution budget
                    // stops heavy combat frames from tripping the "script
                    // running slowly" halt.
                    quality: "low",
                    wmode: "opaque",
                    maxExecutionDuration: 60,
                    // Use an object instead of an indented flashvars string.
                    // Whitespace in that string became part of parameter names.
                    parameters: {
                        spdebug: "notnull",
                        brk: "0",
                        swftoload: "{{SERVERURL}}/default01.static.socialpointgames.com/static/socialempires/flash/{{GAMEVERSION}}?build={{game_asset_version}}",
                        staticUrl: "{{SERVERURL}}/default01.static.socialpointgames.com/static/socialempires/",
                        dynamicUrl: "{{SERVERURL}}/dynamic.flash1.dev.socialpoint.es/appsfb/socialempiresdev/srvempires/",
                        skiphash12341: "notnull",
                        fb_sig_user: "{{save_info.userid}}",
                        user_key: "123456789",
                        language: "en",
                        accessToken: "AAABbZAm0wdMUBALsOrR0Ho68CLjaOT8SV3vftKg9mbo1zZColaW5FljRVaLxPGxXXnm1M98mTZCAttcQ4GHwvSyXfsyxYmvKMH8Hmn5iliSPnjvIsZA6",
                        sex: "m",
                        lastLoggedIn: "1349266517",
                        dailyBonus: "0",
                        friendsInfo: {{ friendsInfo | tojson }},
                        serverTime: "{{serverTime}}",
                        forceSyncError: "1",
                        forceAttackReload: "0",
                        forceQuestReload: "0"
                    }
                });
            </script>
        </object>
    </center>

        <!-- SOCIAL POPUPS: opened by the SWF via ExternalInterface
             ("gotoNeighbors" / "gotoInitialInvite") when an empty ally slot
             is clicked, and showPopupSEHelpSocialItem for staffed buildings. -->
        <div id="allyOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50;">
            <div style="position:relative; margin:120px auto 0; width:420px; max-height:430px; background:#f6e3b3; border:6px solid #7a4a21; border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,.5); font-family:'lucida grande',tahoma,verdana,arial,sans-serif;">
                <div style="background:#7a4a21; color:#ffe9b8; font-weight:bold; font-size:16px; padding:8px 14px; border-radius:6px 6px 0 0;">
                    <span id="allyTitle">Add Allies</span>
                    <span id="allyClose" style="float:right; cursor:pointer; color:#fff; background:#c0392b; border-radius:10px; padding:0 8px;">&#10005;</span>
                </div>
                <div id="allyList" style="overflow-y:auto; max-height:300px; padding:10px 14px;"></div>
                <div style="padding:8px 14px 12px; text-align:center;">
                    <span id="allyHint" style="font-size:11px; color:#7a4a21;">The other empire must accept your request.</span>
                </div>
            </div>
        </div>
        <script>
            (function () {
                var overlay = document.getElementById("allyOverlay"),
                    list = document.getElementById("allyList"),
                    title = document.getElementById("allyTitle"),
                    hint = document.getElementById("allyHint"),
                    mode = "ally",
                    staffContext = null;

                function row(c) {
                    var div = document.createElement("div");
                    div.style.cssText = "display:flex; align-items:center; justify-content:space-between; background:#fff7df; border:2px solid #d9b878; border-radius:8px; padding:6px 10px; margin-bottom:6px;";
                    var label = document.createElement("span");
                    label.textContent = c.name + " (lvl " + c.level + ")";
                    label.style.fontWeight = "bold";
                    var btn = document.createElement("button");
                    btn.textContent = mode === "staff" ? "Ask" : (c.requested ? "Pending" : "Add");
                    btn.style.cssText = "background:#61a827; color:#fff; border:2px solid #3d6e14; border-radius:8px; padding:3px 14px; font-weight:bold; cursor:pointer;";
                    btn.onclick = function () {
                        if (c.requested && mode === "ally") { return; }
                        btn.disabled = true;
                        var endpoint = mode === "staff" ? "/api/request_staff" : "/api/add_ally";
                        var payload = mode === "staff" ? {
                            pid: c.userid,
                            x: staffContext.x,
                            y: staffContext.y,
                            town: staffContext.town,
                            item_id: staffContext.item_id
                        } : {pid: c.userid};
                        fetch(endpoint, {
                            method: "POST",
                            headers: {"Content-Type": "application/json"},
                            body: JSON.stringify(payload)
                        }).then(function (r) { return r.json(); }).then(function (b) {
                            if (b.result === "ok") {
                                btn.textContent = "\u2713 Request sent";
                                btn.style.background = "#9aa89a";
                                btn.style.borderColor = "#6f7a6f";
                            } else {
                                btn.disabled = false;
                            }
                        }).catch(function () { btn.disabled = false; });
                    };
                    div.appendChild(label);
                    div.appendChild(btn);
                    return div;
                }

                function openPopup() {
                    mode = "ally";
                    staffContext = null;
                    title.textContent = "Add Allies";
                    hint.textContent = "The other empire must accept your request.";
                    list.textContent = "Loading...";
                    overlay.style.display = "block";
                    fetch("/api/ally_candidates").then(function (r) { return r.json(); }).then(function (b) {
                        list.textContent = "";
                        var cands = (b && b.candidates) || [];
                        if (!cands.length) {
                            list.textContent = "No players to add - every village on this server is already your ally.";
                            return;
                        }
                        cands.forEach(function (c) { list.appendChild(row(c)); });
                    }).catch(function () { list.textContent = "Could not load players."; });
                }

                function closePopup() {
                    overlay.style.display = "none";
                }

                document.getElementById("allyClose").onclick = closePopup;
                overlay.onclick = function (e) { if (e.target === overlay) { closePopup(); } };

                // Names the SWF calls through ExternalInterface.
                window.gotoNeighbors = openPopup;
                window.gotoInitialInvite = openPopup;
                window.showPopupSEHelpSocialItem = function (x, y, town, itemId, existing, buildingName) {
                    mode = "staff";
                    staffContext = {
                        x: Number(x),
                        y: Number(y),
                        town: Number(town),
                        item_id: Number(itemId)
                    };
                    list.textContent = "Loading...";
                    overlay.style.display = "block";
                    title.textContent = "Ask a friend to help " + String(buildingName || "");
                    hint.textContent = "The role is filled only after that ally accepts on the Friends page.";
                    fetch("/api/staff_candidates").then(function (r) { return r.json(); }).then(function (b) {
                        list.textContent = "";
                        var used = String(existing || "").split(",");
                        var cands = ((b && b.candidates) || []).filter(function (c) {
                            return used.indexOf(String(c.userid)) < 0;
                        });
                        if (!cands.length) {
                            list.textContent = "No accepted allies are available. Add a friend first, or pay cash for this role.";
                            return;
                        }
                        cands.forEach(function (c) { list.appendChild(row(c)); });
                    }).catch(function () { list.textContent = "Could not load allies."; });
                };
            })();
        </script>
        <!-- No-op stubs for the game's Facebook-era ExternalInterface calls.
             With allowScriptAccess:true (needed for the ally popup), the SWF
             now actually invokes these; an undefined JS callee makes Ruffle
             abort the calling ActionScript handler, which left the PvP/quest
             "Mission result" popup stuck on "Saving Results..." (showFeed).
             Define every FB bridge name as a harmless no-op; the `||` keeps the
             real handlers set above (gotoNeighbors etc.) intact. -->
        <script>
            (function () {
                var fbStubs = [
                    "showFeed", "showFeedItemFound", "showFeedSEHire",
                    "share_newtown", "sendFbMessage",
                    "gotoBuy", "gotoBuyWithOfferBuilding", "gotoAdVideo",
                    "gotoGifts", "gotoInitialGifts",
                    "showPopupInvite", "showPopupInviteTournament",
                    "showPopupSEHelpCollect", "showPopupSEHelpNest",
                    "showPopupSEHelpPotion",
                    "askForAchievementPermission", "askInstallApplication",
                    "bookmarDialog", "likeDialog", "openGame",
                    "openSpecialGiftFromFlash", "leveledUp", "flashInitialized"
                ];
                fbStubs.forEach(function (name) {
                    window[name] = window[name] || function () {};
                });
            })();
        </script>
    </body>
</html>
