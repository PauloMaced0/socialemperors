<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Meta -->
        <meta charset="utf-8"/>
        <!-- Title and Icon -->
        <title id="pageTitle">Social Empires</title>
        <link rel="shortcut icon" href="img/icon.gif"/>
        <link rel="icon" type="image/png" href="img/icon.gif"/>
        <!-- Pin Ruffle: the bare @ruffle-rs/ruffle URL auto-updates to the newest
             build, which silently changed AVM behavior and broke the game once
             already. Bump this version only after testing the game against it. -->
        <script src="https://unpkg.com/@ruffle-rs/ruffle@0.4.1/ruffle.js"></script>
        <!--<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle/ruffle.js"></script>-->
    </head>
    <body style="font-family: 'lucida grande',tahoma,verdana,arial,sans-serif">
    <center>
        <!-- SESSION HEADER -->
        <div id="header" style="width: 760px; margin-top: 50px;">
            <div id="session" style="float: right;">
                <p style="display:inline">Logged in as <b>{{save_info.name}}</b> lvl {{save_info.level}} (<a href="/">logout</a>)</p>
            </div>
        </div>
        <br>
        <!-- GAME BAR -->
        <div id="gameBar" style="margin-top: 15px;">
            <!-- GAME BAR TOP -->
            <div id="gamebar_top" style="width: 760px; height: 90px;">
                <div style="float: left; margin-left:155px; padding: 4px; font-size: 10pt">
                    <!-- VERSION -->
                    <br><br><br>
                    <p style="display: inline">{{ version }}</p>
                </div>
            </div>
            <!-- GAME BAR BUTTONS -->
            <div id="gamebar_buttons" style="width: 760px;">
                &nbsp;
                <a class="gameBarButton" href="#"><div><img src="img/gift.png">Free Gifts</div></a>
                <a class="gameBarButton gameBarButtonSelected" href="#"><div><img>Play</div></a>
                <a class="gameBarButton" href="/friends" target="_blank"><div>🤝 Friends</div></a>
                <a class="gameBarButton" href="#"><div><img src="img/cash.png">Get Cash</div></a>
                <a class="gameBarButton" href="https://discord.gg/zW5gSbQJBw" target="_blank"><div><img src="img/discord.png">Discord</div></a>
                <a class="gameBarButton" href="https://github.com/AcidCaos/socialemperors#readme" target="_blank"><div><img src="img/github.png">GitHub</div></a>
            </div>
            <style>
                #gameBar {
                    text-align: left;
                    width: 760px;
                    margin-bottom: 0px;
                    padding: 0px;
                    background-color:rgb(137, 187, 15);
                    background-image: url('img/Gamebar_byTrevo.png');
                    background-repeat: no-repeat;
                    background-size: contain;
                    border-bottom: solid #6e5335 3px;
                }
                .gameBarButton {
                    display: inline-block;
                    height: 19px;
                    color: black;
                    border: solid 1.5px;
                    border-color: #9e7747;
                    background-color:rgb(255, 245, 131);
                    border-top-left-radius: 5px;
                    border-top-right-radius: 5px;
                    cursor: pointer;
                    text-decoration: none;
                    font-size: 11pt;
                    padding: 2px 3px 1px 3px; 
                }

                .gameBarButtonSelected {
                    background-color:rgb(233, 221, 81);
                }

                .gameBarButton img {
                    height: 17px;
                    padding-right: 3px;
                    vertical-align: middle;
                }

                .gameBarButton:hover {
                    background-color:rgb(250, 237, 90);
                    text-decoration: none;
                }

                .gameBarButtonSelected:hover {
                    background-color:rgb(223, 212, 82);
                }

            </style>
        </div>
        <!-- EMBED GAME -->
        <object>
            <div id='ruffle'></div>
            <script>
                var ruffle = window.RufflePlayer.newest(),
                player = Object.assign(document.getElementById("ruffle").appendChild(ruffle.createPlayer()), {
                    width: 760,
                    height: 600,
                    style: 'width: 760px; height: 600px; background-color: #669C2C;',
                });
                player.load({ // https://ruffle.rs/js-docs/master/interfaces/URLLoadOptions.html
                    // Keep SELoader as the root movie so the loaded game reads
                    // these values from Stage.loaderInfo.parameters.
                    url: "{{SERVERURL}}/default01.static.socialpointgames.com/static/socialempires/flash/SELoader.swf?build=20260723",
                    backgroundColor: "#669C2C",
                    allowScriptAccess: false,
                    // Let the SWF's fullscreen button work: it sets
                    // Stage.displayState = FULL_SCREEN, which Ruffle only
                    // honors when allowFullscreen is enabled (default false).
                    // play.html's <embed> had allowFullScreen="true"; this is
                    // the JS-player equivalent, restored after the
                    // play.html -> ruffle.html redirect.
                    allowFullscreen: true,
                    autoplay: "on",
                    // Suppress Ruffle's "Click to unmute" overlay. autoplay is
                    // already "on"; the overlay only exists to satisfy the
                    // browser audio-gesture policy, and the game has its own
                    // in-HUD sound toggle, so the extra click is just noise.
                    unmuteOverlay: "hidden",
                    // Perf: "low" disables Ruffle's bitmap smoothing / anti-
                    // aliasing, the biggest per-pixel cost when a big fight
                    // puts many animated sprites on screen. wmode opaque skips
                    // transparency compositing; the longer execution budget
                    // stops heavy combat frames from tripping the "script
                    // running slowly" halt.
                    quality: "low",
                    wmode: "opaque",
                    maxExecutionDuration: 60,
                    // Use an object instead of an indented flashvars string.
                    // Whitespace in that string became part of parameter names.
                    parameters: {
                        spdebug: "notnull",
                        brk: "0",
                        swftoload: "{{SERVERURL}}/default01.static.socialpointgames.com/static/socialempires/flash/{{GAMEVERSION}}",
                        staticUrl: "{{SERVERURL}}/default01.static.socialpointgames.com/static/socialempires/",
                        dynamicUrl: "{{SERVERURL}}/dynamic.flash1.dev.socialpoint.es/appsfb/socialempiresdev/srvempires/",
                        skiphash12341: "notnull",
                        fb_sig_user: "{{save_info.userid}}",
                        user_key: "123456789",
                        language: "en",
                        accessToken: "AAABbZAm0wdMUBALsOrR0Ho68CLjaOT8SV3vftKg9mbo1zZColaW5FljRVaLxPGxXXnm1M98mTZCAttcQ4GHwvSyXfsyxYmvKMH8Hmn5iliSPnjvIsZA6",
                        sex: "m",
                        lastLoggedIn: "1349266517",
                        dailyBonus: "0",
                        friendsInfo: {{ friendsInfo | tojson }},
                        serverTime: "{{serverTime}}",
                        forceSyncError: "1",
                        forceAttackReload: "0",
                        forceQuestReload: "0"
                    }
                });
            </script>
        </object>
    </center>
    </body>
</html>
